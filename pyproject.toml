[project]
name = "obsidian_inbox_watcher"
version = "0.1.0"
description = "Intelligenter local folder monitor und AI-processor für Obsidian Vault"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "watchdog>=6.0.0",
    "google-genai>=2.5.0",
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "tenacity>=9.1.4",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
obsidian-inbox-watcher = "obsidian_inbox_watcher.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_inbox_watcher"]

# ---------- Ruff (linter + formatter, replaces black/flake8/isort) ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear (common bugs)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (modernize syntax)
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules

    # --- AI-code audit gate -------------------------------------------------
    # Added 2026-09-13 after auditing every repo against the "bad AI code"
    # catalogue. These four are the rules that catalogue turns into findings:
    # a broad catch that hides a failure, an assert standing in for validation,
    # a request without a timeout, an f-string inside a log call, and an import
    # buried in a function body. Each one is allowed where it is justified —
    # but then it carries a `noqa` that says why, instead of passing silently.
    "BLE",     # blind `except Exception`
    "S",       # flake8-bandit: assert-as-validation, missing timeout, shell=True
    "G",       # logging: no f-strings in log calls
    "PLC0415", # import inside a function — deferred imports must justify themselves
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is the point of a test
    "S105",    # fake tokens in fixtures are not secrets
    "S106",
    "PLC0415", # a test may import inside the test that needs it
    "S108",    # "/tmp/..." in a test is a path literal, not a temp file
    "S104",    # a test may assert that "0.0.0.0" is accepted
]
"src/obsidian_inbox_watcher/**" = ["N999"]  # placeholder name, replaced by init-project.sh
# The google-genai SDK is imported where it is used, not at module load: the
# watcher starts, reads its config and reports a bad key before ever touching
# the network stack. A top-level import would move that failure to startup.
"src/obsidian_inbox_watcher/note_builder.py" = ["PLC0415"]
"src/obsidian_inbox_watcher/retrying.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- Mypy (type checker, strict mode) ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["watchdog.*", "pypdf.*", "docx.*", "bs4.*", "google.*"]
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring external services",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ---------- deptry (dependency audit) ----------
# Catches the three dependency defects the AI-code audit looks for: a package
# imported but never declared, a package declared but never imported, and a
# hallucinated name that resolves to nothing. The map below exists because the
# import name and the package name differ — without it deptry reports both
# halves of the same pair and the check stops meaning anything.
[tool.deptry]
known_first_party = ["obsidian_inbox_watcher"]
exclude = [".venv", "tests", "evals", "tools"]

[tool.deptry.package_module_name_map]
python-docx = ["docx"]
beautifulsoup4 = ["bs4"]
pyyaml = ["yaml"]
python-dotenv = ["dotenv"]
google-genai = ["google"]
