# Run on every commit. Install with: uv run pre-commit install
# Update versions periodically with: uv run pre-commit autoupdate

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Ruff: lint + format (replaces black, flake8, isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Mypy: type checking (strict)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.0.0
    hooks:
      - id: mypy
        files: ^(src|tests)/
        # The hook runs mypy in its own environment, so it has to be told what
        # the project depends on. Without tenacity every @retry-decorated
        # function reads as untyped, and without google-genai the SDK's return
        # types collapse to Any — errors `make check` never sees, because there
        # mypy runs in the venv.
        additional_dependencies:
          - pydantic>=2.0
          - types-pyyaml>=6.0
          - tenacity>=9.1.4
          - types-requests>=2.31
          - google-genai>=2.5.0

  # gitleaks: no secret reaches a commit. The repos here are meant to go public,
  # and a secret in history is not removed by deleting it from the tip.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
